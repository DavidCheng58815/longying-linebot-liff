<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>龍穎小幫手｜活動報名</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #6b3fa0;
      --primary-dark: #4f2b79;
      --bg: #f6f3ee;
      --text: #2d2d2d;
      --muted: #666;
      --line: #eadff4;
      --danger: #d64545;
      --success: #2e9d50;
      --warning: #e09b22;
      --soft-purple: #f4f1fa;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 18px 40px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      color: var(--primary);
      letter-spacing: 0.5px;
    }

    h2 {
      font-size: 18px;
      margin: 24px 0 12px;
      color: var(--primary-dark);
    }

    .subtitle {
      margin: 0 0 20px;
      color: var(--muted);
      line-height: 1.6;
      font-size: 15px;
    }

    .status-box {
      border-radius: 14px;
      padding: 14px 16px;
      margin: 16px 0;
      background: var(--soft-purple);
      border-left: 5px solid var(--primary);
      line-height: 1.6;
      font-size: 15px;
    }

    .status-success { background: #eef8f0; border-left-color: var(--success); }
    .status-warning { background: #fff7e6; border-left-color: var(--warning); }
    .status-error { background: #fff0f0; border-left-color: var(--danger); }

    label {
      display: block;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input,
    select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 16px;
      background: #fff;
    }

    button {
      flex: 1;
      border: 0;
      border-radius: 12px;
      padding: 14px 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .primary { background: var(--primary); color: #fff; }
    .secondary { background: #e8e1f1; color: var(--primary-dark); }
    .danger { background: var(--danger); color: #fff; }

    .button-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .hint,
    .mini-note,
    .footer {
      color: #777;
      line-height: 1.5;
    }

    .hint { margin-top: 8px; font-size: 13px; }
    .mini-note { margin-top: 10px; font-size: 13px; }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
      line-height: 1.8;
    }

    .footer {
      margin-top: 18px;
      font-size: 12px;
      text-align: center;
    }

    .events-box { margin-top: 20px; }

    .summary-box {
      background: #fbf9ff;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin: 8px 0 16px;
    }

    .summary-title {
      font-weight: bold;
      color: var(--primary-dark);
      margin-bottom: 10px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .summary-item {
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #f0e8f8;
    }

    .summary-number {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary);
    }

    .summary-label {
      color: #777;
      font-size: 13px;
      margin-top: 2px;
    }

    .event-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      margin: 14px 0;
      background: #fff;
    }

    .event-title {
      font-weight: bold;
      font-size: 17px;
      color: #3a2a4d;
      margin-bottom: 8px;
    }

    .event-meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    .event-status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--soft-purple);
      color: var(--primary);
      font-size: 13px;
      margin: 8px 0;
    }

    .my-status {
      margin-top: 10px;
      font-weight: bold;
      color: #333;
    }

    .meal-status {
      margin-top: 10px;
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }

    .meal-form {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid #f0e8f8;
      border-radius: 14px;
      background: #fbf9ff;
    }

    .meal-form-title {
      font-weight: bold;
      color: var(--primary-dark);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .meal-form-grid {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 8px;
    }

    .meal-form-grid select,
    .meal-form-grid input {
      padding: 11px 12px;
      font-size: 14px;
    }

    .meal-form-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .meal-form-actions button {
      padding: 10px 8px;
      font-size: 14px;
    }

    .guest-form {
      margin-top: 8px;
      padding: 12px;
      border: 1px solid #f0e8f8;
      border-radius: 14px;
      background: #fbf9ff;
    }

    .guest-form-grid {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 8px;
    }

    .guest-form-grid input,
    .guest-form-grid select {
      padding: 11px 12px;
      font-size: 14px;
    }

    .guest-form .guest-note-input {
      grid-column: 1 / -1;
    }

    .guest-form button {
      width: 100%;
      margin-top: 8px;
      padding: 11px 8px;
      font-size: 14px;
    }

    .guest-info {
      flex: 1;
      min-width: 0;
    }

    .guest-name {
      font-weight: bold;
      color: #333;
    }

    .guest-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 84px;
      flex: none;
    }

    .guest-actions button {
      width: 84px;
      flex: none;
      padding: 8px 6px;
      font-size: 13px;
    }

    @media (max-width: 420px) {
      .meal-form-grid,
      .guest-form-grid {
        grid-template-columns: 1fr;
      }
    }


    .event-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .event-actions button {
      padding: 11px 8px;
      font-size: 14px;
    }

    details.event-details {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--line);
    }

    details.event-details summary {
      cursor: pointer;
      color: var(--primary-dark);
      font-weight: bold;
      font-size: 14px;
      list-style: none;
    }

    details.event-details summary::-webkit-details-marker {
      display: none;
    }

    details.event-details summary::after {
      content: "＋";
      float: right;
      color: var(--primary);
    }

    details.event-details[open] summary::after {
      content: "－";
    }

    .detail-content {
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }


    .detail-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .detail-link {
      flex: 1;
      display: block;
      border-radius: 12px;
      padding: 12px 10px;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }

    .detail-link.primary {
      background: var(--primary);
      color: #fff;
    }

    .detail-link.secondary {
      background: #e8e1f1;
      color: var(--primary-dark);
    }

    .guest-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }

    .guest-title {
      font-weight: bold;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .guest-input-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .guest-input-row input {
      flex: 1;
      padding: 11px 12px;
      font-size: 14px;
    }

    .guest-input-row button {
      width: 110px;
      flex: none;
      padding: 11px 8px;
      font-size: 14px;
    }

    .guest-list {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }

    .guest-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f1edf6;
    }

    .guest-item button {
      width: 80px;
      flex: none;
      padding: 8px 6px;
      font-size: 13px;
    }


    .event-card.is-busy {
      border-color: #c9b4df;
      box-shadow: 0 6px 18px rgba(107, 63, 160, 0.10);
    }

    .operation-status-slot:empty {
      display: none;
    }

    .operation-status {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 10px 0 12px;
      padding: 10px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
    }

    .operation-status.queued,
    .operation-status.saving {
      background: #f5f0fb;
      color: var(--primary-dark);
      border: 1px solid #e2d6ef;
    }

    .operation-status.success {
      background: #eef8f0;
      color: #267a3d;
      border: 1px solid #cfe8d5;
    }

    .operation-status.error {
      display: block;
      background: #fff0f0;
      color: #a92f2f;
      border: 1px solid #f1caca;
    }

    .operation-status .retry-operation-btn {
      width: auto;
      min-width: 96px;
      margin-top: 8px;
      padding: 8px 12px;
      font-size: 13px;
    }

    .queue-bar {
      position: fixed;
      left: 50%;
      bottom: calc(12px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(520px, calc(100% - 28px));
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 14px;
      background: rgba(79, 43, 121, 0.96);
      color: #fff;
      font-size: 14px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.20);
      z-index: 999;
    }

    .toast {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(500px, calc(100% - 28px));
      box-sizing: border-box;
      padding: 12px 16px;
      border-radius: 14px;
      background: #333;
      color: #fff;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.20);
      z-index: 1000;
    }

    .toast.success { background: #267a3d; }
    .toast.error { background: #a92f2f; }
    .toast.warning { background: #9a6510; }

    .hidden { display: none; }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>龍穎社小幫手</h1>
      <p class="subtitle">
        請完成社友身分綁定。綁定申請送出後，需由執秘審核通過，才能使用活動報名、取消與來賓登記功能。
      </p>

      <div id="loading" class="loading">系統載入中，請稍候...</div>
      <div id="statusBox" class="status-box hidden"></div>

      <div id="bindForm" class="hidden">
        <label for="searchInput">搜尋社友姓名或英文暱稱</label>
        <input id="searchInput" type="text" placeholder="例如：大D、David、Jessica、王小明" />

        <div class="hint">
          名單顯示格式為「中文姓名｜英文暱稱」。若英文暱稱重複，請以中文姓名確認。
        </div>

        <label for="memberSelect">請選擇您的社友姓名</label>
        <select id="memberSelect">
          <option value="">請先搜尋或選擇社友</option>
        </select>

        <div class="button-row">
          <button id="submitBtn" class="primary">送出綁定申請</button>
        </div>
      </div>

      <div id="pendingBox" class="hidden">
        <div class="button-row">
          <button id="cancelBtn" class="danger">取消申請，重新選擇</button>
        </div>
      </div>

      <div id="eventsBox" class="events-box hidden">
        <h2>活動列表</h2>
        <div id="summaryBox" class="summary-box hidden"></div>
        <div id="eventsContent" class="mini-note">活動資料載入中...</div>
      </div>

      <div id="reloadBox" class="button-row hidden">
        <button id="reloadBtn" class="secondary">重新整理狀態</button>
      </div>

      <div class="footer">
        龍穎社活動報名與來賓管理系統｜v5 即時儲存優化版
      </div>
    </div>
  </div>

  <div id="queueBar" class="queue-bar hidden" role="status" aria-live="polite">
    <span id="queueBarText">正在儲存...</span>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script>
    const CONFIG = {
      LIFF_ID: '2010401579-60qfBgC0',
      GAS_API_URL: 'https://script.google.com/macros/s/AKfycbwZ-0XcZmi7xy6K1VMgMzXpi6s_XNAGGf_Yjml97nyKZaJufQYfpPeP6PlLxIyYPRojHw/exec',
      // EDM 頁面採 event_id 自動讀圖，例如 edm.html?event_id=E0001 -> assets/edm/E0001.jpg
      EDM_PAGE_URL: './edm.html',
      API_TIMEOUT_MS: 45000,
      SUCCESS_MESSAGE_MS: 2600,
      FAILED_OPERATION_MAX_AGE_MS: 24 * 60 * 60 * 1000
    };

    const state = {
      members: [],
      profile: null,
      bindingStatus: null,
      events: [],
      eventMeta: {},
      operations: {},
      operationQueue: [],
      queueRunning: false,
      activeOperation: null,
      needsFullRefresh: false
    };

    const els = {};
    let toastTimer = null;

    window.addEventListener('load', init);
    window.addEventListener('beforeunload', event => {
      if (state.queueRunning || state.operationQueue.length > 0) {
        event.preventDefault();
        event.returnValue = '';
      }
    });

    function init() {
      cacheElements();
      bindStaticEvents();
      main();
    }

    function cacheElements() {
      [
        'loading',
        'statusBox',
        'bindForm',
        'pendingBox',
        'eventsBox',
        'summaryBox',
        'eventsContent',
        'reloadBox',
        'searchInput',
        'memberSelect',
        'submitBtn',
        'cancelBtn',
        'reloadBtn',
        'queueBar',
        'queueBarText',
        'toast'
      ].forEach(id => {
        els[id] = document.getElementById(id);
      });
    }

    function bindStaticEvents() {
      els.searchInput.addEventListener('input', renderMemberOptions);
      els.submitBtn.addEventListener('click', submitBindingRequest);
      els.cancelBtn.addEventListener('click', cancelBindingRequest);
      els.reloadBtn.addEventListener('click', refreshCurrentView);
      els.eventsContent.addEventListener('click', handleEventAreaClick);
    }

    async function main() {
      resetView();
      showLoading('正在初始化 LINE 環境，請稍候...');

      try {
        if (!CONFIG.LIFF_ID) throw new Error('尚未設定 LIFF_ID。');
        if (!CONFIG.GAS_API_URL) throw new Error('尚未設定 GAS_API_URL。');

        await liff.init({ liffId: CONFIG.LIFF_ID });
        showLoading('正在確認 LINE 登入狀態...');

        if (!liff.isLoggedIn()) {
          liff.login({ redirectUri: window.location.href });
          return;
        }

        state.profile = await liff.getProfile();
        showLoading('正在確認身分綁定狀態...');

        const statusResult = await callGasApi('check_binding_status', {});
        if (!statusResult.success) throw new Error(statusResult.error || '取得綁定狀態失敗。');

        state.profile = statusResult.profile || state.profile;
        state.bindingStatus = statusResult.bindingStatus;
        state.members = [];

        const bindingStatus = state.bindingStatus && state.bindingStatus.status;

        if (!bindingStatus || bindingStatus === 'none') {
          showLoading('正在載入社友名單...');

          const memberResult = await callGasApi('get_members', {});
          if (!memberResult.success) throw new Error(memberResult.error || '取得社友名單失敗。');

          state.members = memberResult.members || [];
          state.bindingStatus = memberResult.bindingStatus || state.bindingStatus;
        }

        await renderByBindingStatus();

      } catch (error) {
        showStatus('系統錯誤：' + error.message, 'error');
        console.error(error);
      } finally {
        hideLoading();
      }
    }

    async function refreshCurrentView() {
      if (isQueueBusy()) {
        showToast('目前仍有操作正在儲存，請稍候完成後再重新整理。', 'warning');
        return;
      }

      const status = state.bindingStatus && state.bindingStatus.status;

      if (status === 'active') {
        await loadMyEvents({ showGlobalLoading: true });
        return;
      }

      await main();
    }

    async function renderByBindingStatus() {
      hide(els.bindForm, els.pendingBox, els.eventsBox);
      show(els.reloadBox);

      const status = state.bindingStatus && state.bindingStatus.status;

      if (status === 'active') {
        showStatus(
          '已完成身分綁定<br>' +
          '社友：' + escapeHtml(state.bindingStatus.member_name || '') + '<br>' +
          '您已可以使用活動報名、取消與來賓登記功能。',
          'success'
        );

        show(els.eventsBox);
        await loadMyEvents({ showGlobalLoading: true });
        return;
      }

      if (status === 'pending') {
        showStatus(
          '已有身分綁定申請待審核<br>' +
          '申請社友：' + escapeHtml(state.bindingStatus.requested_member_name || '') + '<br>' +
          '請等待執秘審核。若選錯姓名，可取消後重新選擇。',
          'warning'
        );
        show(els.pendingBox);
        return;
      }

      showStatus(
        '目前尚未完成身分綁定。<br>' +
        'LINE 顯示名稱：' + escapeHtml(state.profile.displayName || '') + '<br>' +
        '請選擇您的社友姓名後送出申請。',
        'normal'
      );

      show(els.bindForm);
      renderMemberOptions();
    }

    function renderMemberOptions() {
      const keyword = normalize(els.searchInput.value);
      const filtered = state.members.filter(member => {
        const text = normalize([
          member.member_name,
          member.nickname,
          member.display_name_for_liff,
          member.member_no
        ].join(' '));
        return !keyword || text.includes(keyword);
      });

      els.memberSelect.innerHTML = '';

      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.textContent = filtered.length ? '請選擇社友' : '查無符合社友，請重新搜尋';
      els.memberSelect.appendChild(defaultOption);

      filtered.forEach(member => {
        const option = document.createElement('option');
        option.value = member.member_id;
        option.textContent = member.display_name_for_liff;
        els.memberSelect.appendChild(option);
      });
    }

    async function submitBindingRequest() {
      const memberId = els.memberSelect.value;
      if (!memberId) {
        alert('請先選擇您的社友姓名。');
        return;
      }

      const selectedMember = state.members.find(member => member.member_id === memberId);
      const name = selectedMember ? selectedMember.display_name_for_liff : memberId;

      const confirmed = confirm(
        '請確認是否送出綁定申請：\n\n' +
        name + '\n\n' +
        '送出後需等待執秘審核。'
      );

      if (!confirmed) return;

      await runAction('正在送出申請...', async () => {
        const result = await callGasApi('submit_binding_request', { member_id: memberId });
        if (!result.success) throw new Error(result.message || result.error || '送出申請失敗。');

        alert(result.message || '已送出身分綁定申請。');
        await main();
      });
    }

    async function cancelBindingRequest() {
      const confirmed = confirm('確定要取消目前待審核的綁定申請嗎？\n\n取消後可以重新選擇社友姓名。');
      if (!confirmed) return;

      await runAction('正在取消申請...', async () => {
        const result = await callGasApi('cancel_binding_request', {});
        if (!result.success) throw new Error(result.message || result.error || '取消申請失敗。');

        alert(result.message || '已取消申請。');
        await main();
      });
    }

    async function loadMyEvents(options = {}) {
      const showGlobalLoading = Boolean(options.showGlobalLoading);
      els.eventsContent.innerHTML = '正在讀取近期活動與您的來賓資料...';
      hide(els.summaryBox);

      try {
        if (showGlobalLoading) {
          showLoading('正在整理您的活動與來賓資料...');
        }

        const result = await callGasApi('get_my_events', {});
        if (!result.success) throw new Error(result.message || result.error || '取得活動資料失敗。');

        state.events = result.events || [];
        state.eventMeta = result.meta || {};
        renderSummary();
        renderEvents();
        restoreFailedOperations();

      } catch (error) {
        els.eventsContent.innerHTML = '<div class="status-box status-error">活動資料載入失敗：' + escapeHtml(error.message) + '</div>';
        console.error(error);
      } finally {
        if (showGlobalLoading) hideLoading();
      }
    }

    function renderSummary() {
      if (!state.events.length) {
        hide(els.summaryBox);
        return;
      }

      const summary = calculateSummary(state.events);

      els.summaryBox.innerHTML = `
        <div class="summary-title">我的報名總覽｜近期活動</div>
        <div class="summary-grid">
          ${buildSummaryItem(summary.joined, '已參加')}
          ${buildSummaryItem(summary.noResponse, '未回覆')}
          ${buildSummaryItem(summary.notJoin, '不參加')}
          ${buildSummaryItem(summary.myGuests, '我的來賓')}
        </div>
      `;

      show(els.summaryBox);
    }

    function calculateSummary(events) {
      return events.reduce((acc, event) => {
        const status = event.my_registration_status || '未回覆';

        if (status === '參加') acc.joined += 1;
        else if (status === '不參加') acc.notJoin += 1;
        else if (status === '已取消') acc.cancelled += 1;
        else acc.noResponse += 1;

        acc.myGuests += Number(event.my_guest_count || 0);
        return acc;
      }, {
        joined: 0,
        notJoin: 0,
        cancelled: 0,
        noResponse: 0,
        myGuests: 0
      });
    }

    function buildSummaryItem(number, label) {
      return `
        <div class="summary-item">
          <div class="summary-number">${escapeHtml(number)}</div>
          <div class="summary-label">${escapeHtml(label)}</div>
        </div>
      `;
    }

    function renderEvents() {
      if (!state.events.length) {
        els.eventsContent.innerHTML = '目前近期沒有可顯示的活動。';
        return;
      }

      els.eventsContent.innerHTML = state.events.map(buildEventCardHtml).join('');
    }

    function buildEventCardHtml(event) {
      const operation = state.operations[event.event_id];
      const busy = operation && (operation.phase === 'queued' || operation.phase === 'saving');

      return `
        <div class="event-card ${busy ? 'is-busy' : ''}" data-event-id="${escapeAttr(event.event_id)}" aria-busy="${busy ? 'true' : 'false'}">
          <div class="event-title">${escapeHtml(event.event_name)}</div>
          <div class="operation-status-slot" data-operation-status-event-id="${escapeAttr(event.event_id)}">
            ${buildOperationStatusHtml(event.event_id)}
          </div>
          <div class="event-status">${escapeHtml(getEventStatusLabel(event.status))}</div>

          <div class="event-meta">
            日期：${escapeHtml(event.event_date || '未設定')}<br>
            時間：${escapeHtml(buildTimeText(event))}<br>
            地點：${escapeHtml(event.location || '未設定')}<br>
            報名截止：${escapeHtml(event.registration_deadline || '未設定')}<br>
            取消截止：${escapeHtml(event.cancel_deadline || '未設定')}
          </div>

          <div class="my-status">
            我的狀態：${escapeHtml(event.my_registration_status || '未回覆')}
            ${Number(event.my_guest_count) ? `｜我的來賓：${escapeHtml(event.my_guest_count)} 位` : ''}
          </div>

          ${buildEventActions(event)}
          ${buildEventDetails(event)}
          ${buildGuestManager(event)}
        </div>
      `;
    }

    function buildOperationStatusHtml(eventId) {
      const operation = state.operations[eventId];
      if (!operation) return '';

      const message = escapeHtml(operation.message || '');

      if (operation.phase === 'queued') {
        return `<div class="operation-status queued">⏳ ${message || '已加入儲存佇列，請稍候...'}</div>`;
      }

      if (operation.phase === 'saving') {
        return `<div class="operation-status saving">⏳ ${message || '正在儲存，您可以繼續操作其他活動。'}</div>`;
      }

      if (operation.phase === 'success') {
        return `<div class="operation-status success">✓ ${message || '已完成儲存'}</div>`;
      }

      if (operation.phase === 'error') {
        const retryButton = operation.retryable === false
          ? ''
          : `<button class="secondary retry-operation-btn" data-event-id="${escapeAttr(eventId)}">重新送出</button>`;

        return `
          <div class="operation-status error">
            <div>⚠ ${message || '操作尚未完成，請重新送出。'}</div>
            ${retryButton}
          </div>
        `;
      }

      return '';
    }

    function buildEventActions(event) {
      const status = event.my_registration_status || '未回覆';

      if (status === '參加') {
        const mealText = buildMealDisplayText(event.my_meal_preference, event.my_meal_note);
        const mealForm = event.can_cancel ? buildMemberMealForm(event, 'update') : '';
        const updateButton = event.can_cancel
          ? `<button class="secondary member-meal-update-btn" data-event-id="${escapeAttr(event.event_id)}">修改餐食</button>`
          : '';
        const cancelButton = event.can_cancel
          ? `<button class="danger event-action-btn" data-event-id="${escapeAttr(event.event_id)}" data-status="已取消">取消報名</button>`
          : '';
        const note = event.can_cancel
          ? ''
          : '<div class="mini-note">您已報名此活動，且已超過取消期限。若需異動餐食或取消，請聯繫執秘。</div>';

        return `
          <div class="meal-status">我的餐食：${escapeHtml(mealText)}</div>
          ${mealForm}
          ${updateButton || cancelButton ? `<div class="event-actions">${updateButton}${cancelButton}</div>` : ''}
          ${note}
        `;
      }

      if (!event.can_register) {
        return `<div class="mini-note">${escapeHtml(event.register_message || '此活動目前不可操作。')}</div>`;
      }

      const buttons = [`
        <button class="primary event-action-btn" data-event-id="${escapeAttr(event.event_id)}" data-status="參加">
          參加
        </button>
      `];

      if (status !== '不參加') {
        buttons.push(`
          <button class="secondary event-action-btn" data-event-id="${escapeAttr(event.event_id)}" data-status="不參加">
            不參加
          </button>
        `);
      }

      return `
        ${buildMemberMealForm(event, 'register')}
        <div class="event-actions">${buttons.join('')}</div>
      `;
    }

    function buildMemberMealForm(event, mode) {
      const currentMeal = event.my_meal_preference || '葷食';
      const currentNote = event.my_meal_note || '';
      const title = mode === 'update' ? '修改本人餐食' : '報名餐食選擇';

      return `
        <div class="meal-form" data-member-meal-form-event-id="${escapeAttr(event.event_id)}">
          <div class="meal-form-title">${escapeHtml(title)}</div>
          <div class="meal-form-grid">
            <select data-member-meal-select-event-id="${escapeAttr(event.event_id)}">
              ${buildMealOptionsHtml(currentMeal)}
            </select>
            <input type="text" placeholder="餐食備註，例如：不吃牛、蛋奶素、全素" value="${escapeAttr(currentNote)}" data-member-meal-note-event-id="${escapeAttr(event.event_id)}">
          </div>
          <div class="mini-note">若無特殊需求，備註可留空。</div>
        </div>
      `;
    }

    function buildMealOptionsHtml(selectedMeal) {
      const selected = normalizeMealPreference(selectedMeal) || '葷食';
      return ['葷食', '素食'].map(option => {
        return `<option value="${escapeAttr(option)}" ${option === selected ? 'selected' : ''}>${escapeHtml(option)}</option>`;
      }).join('');
    }

    function getMemberMealPayload(eventId) {
      const mealSelect = queryByData('member-meal-select-event-id', eventId);
      const mealNoteInput = queryByData('member-meal-note-event-id', eventId);

      return {
        meal_preference: mealSelect ? mealSelect.value : '葷食',
        meal_note: mealNoteInput ? mealNoteInput.value.trim() : ''
      };
    }

    function buildMealDisplayText(mealPreference, mealNote) {
      const meal = normalizeMealPreference(mealPreference) || '未填';
      const note = String(mealNote || '').trim();
      return note ? meal + '｜' + note : meal;
    }

    function normalizeMealPreference(value) {
      const text = String(value || '').trim();
      if (text === '葷' || text === '葷食') return '葷食';
      if (text === '素' || text === '素食') return '素食';
      return text;
    }

    function buildEventDetails(event) {
      const edmUrl = buildEdmUrl(event.event_id);

      return `
        <details class="event-details">
          <summary>查看活動詳情</summary>
          <div class="detail-content">
            類型：${escapeHtml(event.event_type || '未設定')}<br>
            例會次數：${escapeHtml(event.event_no || '未設定')}<br>
            主題：${escapeHtml(event.topic || '未設定')}<br>
            講師：${escapeHtml(event.speaker || '未設定')}<br>
            費用：${escapeHtml(event.fee || '未設定')}<br>
            目前人數：社友 ${escapeHtml(event.member_count)} 位、來賓 ${escapeHtml(event.guest_count)} 位，總計 ${escapeHtml(event.total_count)} 位<br>
            來賓設定：${isTrue(event.guest_allowed) ? '開放' : '不開放'}${event.guest_limit ? '｜每位上限：' + escapeHtml(event.guest_limit) : ''}${event.max_capacity ? '｜總人數上限：' + escapeHtml(event.max_capacity) : ''}
            ${event.announcement_text ? '<br>公告：' + escapeHtml(event.announcement_text) : ''}

            <div class="detail-actions">
              <a class="detail-link primary" href="${escapeAttr(edmUrl)}">查看活動 EDM</a>
            </div>
          </div>
        </details>
      `;
    }

    function buildEdmUrl(eventId) {
      const safeEventId = String(eventId || '').trim().toUpperCase();
      const separator = CONFIG.EDM_PAGE_URL.includes('?') ? '&' : '?';
      return CONFIG.EDM_PAGE_URL + separator + 'event_id=' + encodeURIComponent(safeEventId);
    }

    function buildGuestManager(event) {
      if (!isTrue(event.guest_allowed)) return '';

      const canAddGuest = Boolean(event.can_add_guest ?? event.can_register);
      const canCancelGuest = Boolean(event.can_cancel_guest ?? event.can_cancel);
      const guests = Array.isArray(event.my_guests) ? event.my_guests : [];

      const inputHtml = canAddGuest
        ? `
          <div class="guest-form" data-guest-form-event-id="${escapeAttr(event.event_id)}">
            <div class="guest-form-grid">
              <input type="text" placeholder="輸入來賓姓名" data-guest-input-event-id="${escapeAttr(event.event_id)}">
              <select data-guest-meal-select-event-id="${escapeAttr(event.event_id)}">
                ${buildMealOptionsHtml('葷食')}
              </select>
              <input class="guest-note-input" type="text" placeholder="餐食備註，例如：不吃牛、蛋奶素、全素" data-guest-meal-note-event-id="${escapeAttr(event.event_id)}">
            </div>
            <div class="mini-note">新增來賓時請同步選擇餐食。若無特殊需求，備註可留空。</div>
            <button class="primary add-guest-btn" data-event-id="${escapeAttr(event.event_id)}">新增來賓</button>
          </div>
        `
        : `<div class="mini-note">${escapeHtml(event.add_guest_message || '此活動目前不可新增來賓。')}</div>`;

      const cancelNote = (!canCancelGuest && guests.length)
        ? '<div class="mini-note">目前已超過來賓取消與餐食修改期限，如需異動請聯繫執秘。</div>'
        : '';

      return `
        <div class="guest-box" data-guest-event-id="${escapeAttr(event.event_id)}">
          <div class="guest-title">我的來賓</div>
          ${inputHtml}
          ${cancelNote}
          <div class="guest-list" data-guest-list-event-id="${escapeAttr(event.event_id)}">
            ${buildGuestListHtml(event, guests, canCancelGuest)}
          </div>
        </div>
      `;
    }

    function buildGuestListHtml(event, guests, canCancelGuest) {
      if (!guests.length) {
        return '<div class="mini-note">目前尚未登記來賓。</div>';
      }

      return guests.map(guest => {
        const mealText = buildMealDisplayText(guest.meal_preference, guest.meal_note);
        const mealEditor = canCancelGuest
          ? `
            <div class="meal-form" data-guest-meal-form-guest-id="${escapeAttr(guest.guest_id)}">
              <div class="meal-form-grid">
                <select data-guest-meal-select-guest-id="${escapeAttr(guest.guest_id)}">
                  ${buildMealOptionsHtml(guest.meal_preference || '葷食')}
                </select>
                <input type="text" placeholder="餐食備註" value="${escapeAttr(guest.meal_note || '')}" data-guest-meal-note-guest-id="${escapeAttr(guest.guest_id)}">
              </div>
              <div class="meal-form-actions">
                <button class="secondary update-guest-meal-btn"
                  data-event-id="${escapeAttr(event.event_id)}"
                  data-guest-id="${escapeAttr(guest.guest_id)}"
                  data-guest-name="${escapeAttr(guest.guest_name)}">修改餐食</button>
              </div>
            </div>
          `
          : '';

        const cancelButton = canCancelGuest
          ? `
            <button class="danger cancel-guest-btn"
              data-event-id="${escapeAttr(event.event_id)}"
              data-guest-id="${escapeAttr(guest.guest_id)}"
              data-guest-name="${escapeAttr(guest.guest_name)}">取消</button>
          `
          : '';

        return `
          <div class="guest-item">
            <div class="guest-info">
              <div class="guest-name">${escapeHtml(guest.guest_name)}</div>
              <div class="mini-note">餐食：${escapeHtml(mealText)}</div>
              ${mealEditor}
            </div>
            <div class="guest-actions">${cancelButton}</div>
          </div>
        `;
      }).join('');
    }

    function handleEventAreaClick(clickEvent) {
      const button = clickEvent.target.closest('button');
      if (!button || button.disabled) return;

      if (button.classList.contains('event-action-btn')) {
        submitMemberRegistration(
          button.getAttribute('data-event-id'),
          button.getAttribute('data-status')
        );
        return;
      }

      if (button.classList.contains('member-meal-update-btn')) {
        updateMemberMeal(button.getAttribute('data-event-id'));
        return;
      }

      if (button.classList.contains('add-guest-btn')) {
        addGuest(button.getAttribute('data-event-id'));
        return;
      }

      if (button.classList.contains('update-guest-meal-btn')) {
        updateGuestMeal(
          button.getAttribute('data-event-id'),
          button.getAttribute('data-guest-id'),
          button.getAttribute('data-guest-name')
        );
        return;
      }

      if (button.classList.contains('cancel-guest-btn')) {
        cancelGuest(
          button.getAttribute('data-event-id'),
          button.getAttribute('data-guest-id'),
          button.getAttribute('data-guest-name')
        );
        return;
      }

      if (button.classList.contains('retry-operation-btn')) {
        retryOperation(button.getAttribute('data-event-id'));
      }
    }

    function submitMemberRegistration(eventId, status) {
      if (isEventBusy(eventId)) return;

      const event = findEvent(eventId);
      const eventName = event ? event.event_name : eventId;
      const mealPayload = status === '參加' ? getMemberMealPayload(eventId) : {};

      const confirmed = confirm(
        status === '已取消'
          ? '確定要取消報名？\n\n活動：' + eventName
          : '確定要送出活動狀態？\n\n活動：' + eventName + '\n狀態：' + status +
            (status === '參加' ? '\n餐食：' + buildMealDisplayText(mealPayload.meal_preference, mealPayload.meal_note) : '')
      );

      if (!confirmed) return;

      enqueueOperation({
        id: createRequestId(),
        eventId,
        action: 'submit_member_registration',
        payload: { event_id: eventId, status, ...mealPayload },
        waitingMessage: '活動狀態等待儲存...',
        savingMessage: '正在儲存活動狀態，您可以繼續操作其他活動。',
        fallbackSuccessMessage: status === '參加' ? '已完成報名' : '已完成狀態更新',
        createdAt: Date.now()
      });
    }

    function updateMemberMeal(eventId) {
      if (isEventBusy(eventId)) return;

      const event = findEvent(eventId);
      const eventName = event ? event.event_name : eventId;
      const mealPayload = getMemberMealPayload(eventId);

      const confirmed = confirm(
        '確定要更新本人餐食？\n\n' +
        '活動：' + eventName + '\n' +
        '餐食：' + buildMealDisplayText(mealPayload.meal_preference, mealPayload.meal_note)
      );

      if (!confirmed) return;

      enqueueOperation({
        id: createRequestId(),
        eventId,
        action: 'update_member_meal',
        payload: { event_id: eventId, ...mealPayload },
        waitingMessage: '餐食修改等待儲存...',
        savingMessage: '正在更新本人餐食...',
        fallbackSuccessMessage: '已完成餐食更新',
        createdAt: Date.now()
      });
    }

    function addGuest(eventId) {
      if (isEventBusy(eventId)) return;

      const input = queryByData('guest-input-event-id', eventId);
      const mealSelect = queryByData('guest-meal-select-event-id', eventId);
      const mealNoteInput = queryByData('guest-meal-note-event-id', eventId);
      if (!input) return;

      const guestName = input.value.trim();
      if (!guestName) {
        alert('請先輸入來賓姓名。');
        return;
      }

      const mealPayload = {
        meal_preference: mealSelect ? mealSelect.value : '葷食',
        meal_note: mealNoteInput ? mealNoteInput.value.trim() : ''
      };

      const event = findEvent(eventId);
      const eventName = event ? event.event_name : eventId;

      const confirmed = confirm(
        '確定要新增來賓？\n\n' +
        '活動：' + eventName + '\n' +
        '來賓：' + guestName + '\n' +
        '餐食：' + buildMealDisplayText(mealPayload.meal_preference, mealPayload.meal_note)
      );

      if (!confirmed) return;

      enqueueOperation({
        id: createRequestId(),
        eventId,
        action: 'add_guest_registration',
        payload: { event_id: eventId, guest_name: guestName, ...mealPayload },
        waitingMessage: '來賓資料等待儲存...',
        savingMessage: '正在新增來賓...',
        fallbackSuccessMessage: '已新增來賓：' + guestName,
        createdAt: Date.now()
      });
    }

    function updateGuestMeal(eventId, guestId, guestName) {
      if (isEventBusy(eventId)) return;

      const mealSelect = queryByData('guest-meal-select-guest-id', guestId);
      const mealNoteInput = queryByData('guest-meal-note-guest-id', guestId);
      const mealPayload = {
        meal_preference: mealSelect ? mealSelect.value : '葷食',
        meal_note: mealNoteInput ? mealNoteInput.value.trim() : ''
      };

      const confirmed = confirm(
        '確定要更新這位來賓的餐食？\n\n' +
        '來賓：' + guestName + '\n' +
        '餐食：' + buildMealDisplayText(mealPayload.meal_preference, mealPayload.meal_note)
      );

      if (!confirmed) return;

      enqueueOperation({
        id: createRequestId(),
        eventId,
        action: 'update_guest_meal',
        payload: { guest_id: guestId, ...mealPayload },
        waitingMessage: '來賓餐食等待儲存...',
        savingMessage: '正在更新來賓餐食...',
        fallbackSuccessMessage: '已完成來賓餐食更新',
        createdAt: Date.now()
      });
    }

    function cancelGuest(eventId, guestId, guestName) {
      if (isEventBusy(eventId)) return;

      const confirmed = confirm('確定要取消這位來賓？\n\n來賓：' + guestName);
      if (!confirmed) return;

      enqueueOperation({
        id: createRequestId(),
        eventId,
        action: 'cancel_guest_registration',
        payload: { guest_id: guestId },
        waitingMessage: '取消來賓等待儲存...',
        savingMessage: '正在取消來賓...',
        fallbackSuccessMessage: '已取消來賓：' + guestName,
        createdAt: Date.now()
      });
    }

    function enqueueOperation(operation, options = {}) {
      if (!operation || !operation.eventId || !operation.action) return;

      if (isEventBusy(operation.eventId)) {
        showToast('這場活動仍在儲存中，請稍候完成。', 'warning');
        return;
      }

      if (!options.retry) {
        removeFailedOperationsForEvent(operation.eventId);
      }

      state.operations[operation.eventId] = {
        phase: 'queued',
        message: operation.waitingMessage || '等待儲存...',
        operation
      };

      setEventCardBusy(operation.eventId, true);
      renderOperationStatusOnly(operation.eventId);
      state.operationQueue.push(operation);
      updateQueueBar();
      processOperationQueue();
    }

    async function processOperationQueue() {
      if (state.queueRunning) return;

      state.queueRunning = true;

      while (state.operationQueue.length > 0) {
        const operation = state.operationQueue.shift();
        state.activeOperation = operation;

        state.operations[operation.eventId] = {
          phase: 'saving',
          message: operation.savingMessage || '正在儲存...',
          operation
        };

        setEventCardBusy(operation.eventId, true);
        renderOperationStatusOnly(operation.eventId);
        updateQueueBar();

        try {
          const result = await callGasApi(operation.action, {
            ...operation.payload,
            request_id: operation.id
          });

          if (!result.success) {
            if (result.event) {
              replaceEventInState(result.event);
              renderSummary();
              renderSingleEvent(operation.eventId);
            }

            const apiError = new Error(result.message || result.error || '操作失敗。');
            apiError.code = result.code || '';
            throw apiError;
          }

          state.operations[operation.eventId] = {
            phase: 'success',
            message: result.message || operation.fallbackSuccessMessage || '已完成儲存',
            operation
          };

          if (result.event) {
            replaceEventInState(result.event);
          } else {
            patchEventFromLegacyResult(operation, result);
            state.needsFullRefresh = true;
          }

          renderSummary();
          renderSingleEvent(operation.eventId);
          removeFailedOperation(operation.id);
          showToast(result.message || operation.fallbackSuccessMessage || '已完成儲存', 'success');
          scheduleOperationStatusClear(operation.eventId, operation.id);

        } catch (error) {
          const message = error.message || '操作尚未完成，請重新送出。';
          const retryable = isRetryableOperationError(error);

          state.operations[operation.eventId] = {
            phase: 'error',
            message,
            retryable,
            operation
          };

          if (retryable) {
            persistFailedOperation(operation, message);
          } else {
            removeFailedOperation(operation.id);
            scheduleOperationStatusClear(operation.eventId, operation.id, 6500);
          }

          setEventCardBusy(operation.eventId, false);
          renderOperationStatusOnly(operation.eventId);
          showToast(message, 'error');
          console.error(error);
        } finally {
          setEventCardBusy(operation.eventId, false);
          state.activeOperation = null;
          updateQueueBar();
        }
      }

      state.queueRunning = false;
      updateQueueBar();

      if (state.needsFullRefresh && !hasFailedOperations()) {
        state.needsFullRefresh = false;
        await loadMyEvents({ showGlobalLoading: false });
      }
    }

    function retryOperation(eventId) {
      const operationState = state.operations[eventId];
      const operation = operationState && operationState.operation;

      if (!operation) {
        showToast('找不到可重新送出的操作，請重新整理活動資料。', 'warning');
        return;
      }

      delete state.operations[eventId];
      renderOperationStatusOnly(eventId);
      enqueueOperation(operation, { retry: true });
    }

    function replaceEventInState(updatedEvent) {
      const index = state.events.findIndex(event => event.event_id === updatedEvent.event_id);

      if (index >= 0) {
        state.events[index] = updatedEvent;
      }
    }

    function patchEventFromLegacyResult(operation, result) {
      const event = findEvent(operation.eventId);
      if (!event) return;

      if (operation.action === 'submit_member_registration' && result.registration) {
        const oldStatus = event.my_registration_status || '未回覆';
        const newStatus = result.registration.status || operation.payload.status;

        if (oldStatus !== '參加' && newStatus === '參加') {
          event.member_count = Number(event.member_count || 0) + 1;
          event.total_count = Number(event.total_count || 0) + 1;
        }

        if (oldStatus === '參加' && newStatus !== '參加') {
          event.member_count = Math.max(0, Number(event.member_count || 0) - 1);
          event.total_count = Math.max(0, Number(event.total_count || 0) - 1);
        }

        event.my_registration_status = newStatus;
        if (newStatus === '參加') {
          event.my_meal_preference = result.registration.meal_preference || operation.payload.meal_preference || '';
          event.my_meal_note = result.registration.meal_note || operation.payload.meal_note || '';
        }
      }

      if (operation.action === 'update_member_meal') {
        event.my_meal_preference = operation.payload.meal_preference || '';
        event.my_meal_note = operation.payload.meal_note || '';
      }

      if (operation.action === 'add_guest_registration' && result.guest) {
        event.my_guests = Array.isArray(event.my_guests) ? event.my_guests : [];
        event.my_guests.push(result.guest);
        event.my_guest_count = event.my_guests.length;
        event.guest_count = Number(event.guest_count || 0) + 1;
        event.total_count = Number(event.total_count || 0) + 1;
      }

      if (operation.action === 'update_guest_meal' && result.guest) {
        const guest = (event.my_guests || []).find(item => item.guest_id === result.guest.guest_id);
        if (guest) {
          guest.meal_preference = result.guest.meal_preference;
          guest.meal_note = result.guest.meal_note;
        }
      }

      if (operation.action === 'cancel_guest_registration' && result.guest) {
        event.my_guests = (event.my_guests || []).filter(item => item.guest_id !== result.guest.guest_id);
        event.my_guest_count = event.my_guests.length;
        event.guest_count = Math.max(0, Number(event.guest_count || 0) - 1);
        event.total_count = Math.max(0, Number(event.total_count || 0) - 1);
      }
    }

    function renderSingleEvent(eventId) {
      const event = findEvent(eventId);
      const oldCard = getEventCard(eventId);

      if (!event || !oldCard) return;

      const details = oldCard.querySelector('details.event-details');
      const detailsWasOpen = Boolean(details && details.open);
      oldCard.outerHTML = buildEventCardHtml(event);

      if (detailsWasOpen) {
        const newCard = getEventCard(eventId);
        const newDetails = newCard && newCard.querySelector('details.event-details');
        if (newDetails) newDetails.open = true;
      }
    }

    function renderOperationStatusOnly(eventId) {
      const slot = els.eventsContent.querySelector(
        `[data-operation-status-event-id="${cssEscape(eventId)}"]`
      );

      if (slot) {
        slot.innerHTML = buildOperationStatusHtml(eventId);
      }
    }

    function scheduleOperationStatusClear(eventId, operationId, durationMs) {
      window.setTimeout(() => {
        const current = state.operations[eventId];

        if (current && current.operation && current.operation.id === operationId &&
            (current.phase === 'success' || (current.phase === 'error' && current.retryable === false))) {
          delete state.operations[eventId];
          renderOperationStatusOnly(eventId);
        }
      }, durationMs || CONFIG.SUCCESS_MESSAGE_MS);
    }

    function isRetryableOperationError(error) {
      const nonRetryableCodes = new Set([
        'not_bound',
        'event_not_available',
        'event_full',
        'meal_update_not_available',
        'guest_not_allowed',
        'guest_not_available',
        'duplicate_guest',
        'guest_limit_reached',
        'guest_meal_update_not_available',
        'guest_cancel_not_available'
      ]);

      return !nonRetryableCodes.has(String(error && error.code || ''));
    }

    function setEventCardBusy(eventId, busy) {
      const card = getEventCard(eventId);
      if (!card) return;

      card.classList.toggle('is-busy', busy);
      card.setAttribute('aria-busy', busy ? 'true' : 'false');

      card.querySelectorAll('button, input, select').forEach(control => {
        if (busy) {
          if (!Object.prototype.hasOwnProperty.call(control.dataset, 'wasDisabled')) {
            control.dataset.wasDisabled = control.disabled ? '1' : '0';
          }
          control.disabled = true;
        } else if (Object.prototype.hasOwnProperty.call(control.dataset, 'wasDisabled')) {
          control.disabled = control.dataset.wasDisabled === '1';
          delete control.dataset.wasDisabled;
        }
      });
    }

    function getEventCard(eventId) {
      return els.eventsContent.querySelector(
        `.event-card[data-event-id="${cssEscape(eventId)}"]`
      );
    }

    function isEventBusy(eventId) {
      const operation = state.operations[eventId];
      return Boolean(operation && (operation.phase === 'queued' || operation.phase === 'saving'));
    }

    function isQueueBusy() {
      return state.queueRunning || state.operationQueue.length > 0 || Boolean(state.activeOperation);
    }

    function updateQueueBar() {
      const waitingCount = state.operationQueue.length + (state.activeOperation ? 1 : 0);
      const busy = waitingCount > 0;

      if (busy) {
        els.queueBarText.textContent = waitingCount === 1
          ? '正在儲存 1 項操作，請稍候...'
          : '正在依序儲存 ' + waitingCount + ' 項操作，您可以繼續查看其他活動。';
        show(els.queueBar);
      } else {
        hide(els.queueBar);
      }

      els.reloadBtn.disabled = busy;
    }

    function showToast(message, type) {
      if (toastTimer) window.clearTimeout(toastTimer);

      els.toast.textContent = message || '';
      els.toast.className = 'toast';
      if (type) els.toast.classList.add(type);
      show(els.toast);

      toastTimer = window.setTimeout(() => {
        hide(els.toast);
      }, type === 'error' ? 5200 : 3000);
    }

    function createRequestId() {
      if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
      }

      return 'REQ-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
    }

    function getFailedStorageKey() {
      const memberId = state.bindingStatus && state.bindingStatus.member_id;
      return memberId ? 'longying_failed_operations_v1_' + memberId : '';
    }

    function readFailedOperations() {
      const key = getFailedStorageKey();
      if (!key) return [];

      try {
        const list = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(list) ? list : [];
      } catch (error) {
        return [];
      }
    }

    function writeFailedOperations(list) {
      const key = getFailedStorageKey();
      if (!key) return;

      try {
        localStorage.setItem(key, JSON.stringify(list || []));
      } catch (error) {
        console.warn('無法保存失敗操作：', error);
      }
    }

    function persistFailedOperation(operation, errorMessage) {
      const list = readFailedOperations().filter(item => item.id !== operation.id);
      list.push({
        ...operation,
        errorMessage: errorMessage || '',
        failedAt: Date.now()
      });
      writeFailedOperations(list);
    }

    function removeFailedOperation(operationId) {
      writeFailedOperations(readFailedOperations().filter(item => item.id !== operationId));
    }

    function removeFailedOperationsForEvent(eventId) {
      writeFailedOperations(readFailedOperations().filter(item => item.eventId !== eventId));
    }

    function restoreFailedOperations() {
      const now = Date.now();
      const visibleEventIds = new Set(state.events.map(event => event.event_id));
      const valid = readFailedOperations().filter(operation => {
        const time = Number(operation.failedAt || operation.createdAt || 0);
        if (!visibleEventIds.has(operation.eventId) ||
            time <= 0 ||
            now - time > CONFIG.FAILED_OPERATION_MAX_AGE_MS) {
          return false;
        }

        const event = findEvent(operation.eventId);
        return !isOperationAlreadyApplied(operation, event);
      });

      writeFailedOperations(valid);

      valid.forEach(operation => {
        if (isEventBusy(operation.eventId)) return;

        state.operations[operation.eventId] = {
          phase: 'error',
          message: operation.errorMessage || '上次操作可能尚未完成，請重新送出或重新整理確認。',
          retryable: true,
          operation
        };
        renderOperationStatusOnly(operation.eventId);
      });
    }

    function isOperationAlreadyApplied(operation, event) {
      if (!operation || !event) return false;
      const payload = operation.payload || {};

      if (operation.action === 'submit_member_registration') {
        const sameStatus = String(event.my_registration_status || '') === String(payload.status || '');
        if (!sameStatus) return false;

        if (payload.status === '參加') {
          return normalizeMealPreference(event.my_meal_preference) === normalizeMealPreference(payload.meal_preference) &&
                 String(event.my_meal_note || '').trim() === String(payload.meal_note || '').trim();
        }

        return true;
      }

      if (operation.action === 'update_member_meal') {
        return normalizeMealPreference(event.my_meal_preference) === normalizeMealPreference(payload.meal_preference) &&
               String(event.my_meal_note || '').trim() === String(payload.meal_note || '').trim();
      }

      if (operation.action === 'add_guest_registration') {
        return (event.my_guests || []).some(guest => {
          return String(guest.guest_name || '').trim() === String(payload.guest_name || '').trim() &&
                 normalizeMealPreference(guest.meal_preference) === normalizeMealPreference(payload.meal_preference) &&
                 String(guest.meal_note || '').trim() === String(payload.meal_note || '').trim();
        });
      }

      if (operation.action === 'update_guest_meal') {
        const guest = (event.my_guests || []).find(item => item.guest_id === payload.guest_id);
        return Boolean(guest) &&
               normalizeMealPreference(guest.meal_preference) === normalizeMealPreference(payload.meal_preference) &&
               String(guest.meal_note || '').trim() === String(payload.meal_note || '').trim();
      }

      if (operation.action === 'cancel_guest_registration') {
        return !(event.my_guests || []).some(item => item.guest_id === payload.guest_id);
      }

      return false;
    }

    function hasFailedOperations() {
      return Object.values(state.operations).some(operation => operation && operation.phase === 'error');
    }

    async function callGasApi(action, payload) {
      const accessToken = liff.getAccessToken();
      if (!accessToken) throw new Error('無法取得 LINE access token，請重新開啟頁面。');

      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timeoutId = controller
        ? window.setTimeout(() => controller.abort(), CONFIG.API_TIMEOUT_MS)
        : null;

      try {
        const response = await fetch(CONFIG.GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, access_token: accessToken, ...payload }),
          redirect: 'follow',
          signal: controller ? controller.signal : undefined
        });

        const text = await response.text();

        try {
          return JSON.parse(text);
        } catch (error) {
          throw new Error('GAS 回傳內容不是 JSON：' + text.slice(0, 200));
        }
      } catch (error) {
        if (error && error.name === 'AbortError') {
          throw new Error('連線逾時。此操作可能仍已送出，請按「重新送出」或重新整理活動資料確認。');
        }
        throw error;
      } finally {
        if (timeoutId) window.clearTimeout(timeoutId);
      }
    }

    async function runAction(loadingText, fn) {
      setButtonsDisabled(true);
      showLoading(loadingText);

      try {
        await fn();
      } catch (error) {
        alert(error.message || '操作失敗。');
        console.error(error);
      } finally {
        setButtonsDisabled(false);
        hideLoading();
      }
    }

    function resetView() {
      show(els.loading);
      hide(els.statusBox, els.bindForm, els.pendingBox, els.eventsBox, els.reloadBox, els.queueBar, els.toast);
    }

    function showLoading(message) {
      els.loading.textContent = message;
      show(els.loading);
    }

    function hideLoading() { hide(els.loading); }

    function showStatus(message, type) {
      els.statusBox.innerHTML = message;
      els.statusBox.className = 'status-box';

      if (type === 'success') els.statusBox.classList.add('status-success');
      if (type === 'warning') els.statusBox.classList.add('status-warning');
      if (type === 'error') els.statusBox.classList.add('status-error');

      show(els.statusBox);
    }

    function show(...elements) {
      elements.forEach(element => element && element.classList.remove('hidden'));
    }

    function hide(...elements) {
      elements.forEach(element => element && element.classList.add('hidden'));
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('button').forEach(button => { button.disabled = disabled; });
    }

    function findEvent(eventId) {
      return state.events.find(event => event.event_id === eventId);
    }

    function buildTimeText(event) {
      const start = event.start_time || '';
      const end = event.end_time || '';

      if (start && end) return start + '–' + end;
      if (start) return start;
      if (end) return end;
      return '未設定';
    }

    function getEventStatusLabel(status) {
      const map = {
        draft: '草稿',
        preview: '活動預告',
        open: '報名中',
        closing_soon: '即將截止',
        closed: '已截止',
        finalizing: '名單確認中',
        completed: '已完成'
      };

      return map[normalize(status)] || status || '未設定';
    }

    function queryByData(key, value) {
      return els.eventsContent.querySelector(`[data-${key}="${cssEscape(value)}"]`);
    }

    function isTrue(value) {
      return value === true || normalize(value) === 'true' || value === '是' || value === '1';
    }

    function normalize(value) {
      return String(value || '').trim().toLowerCase();
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(value) {
      return escapeHtml(value).replaceAll('`', '&#096;');
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value || '').replace(/"/g, '\\"');
    }
  </script>
</body>
